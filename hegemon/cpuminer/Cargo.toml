[package]
name = "hegemon-cpuminer"
version = "0.10.3"
edition = "2021"
description = "Standalone multi-threaded CPU miner for Hegemon v0.10.3 (connects to a node's remote-mining endpoint)"
license = "MIT"

[dependencies]
# "compress" exposes the raw SHA-256 compression function; sha2 picks the
# fastest backend at runtime (SHA-NI on modern AMD/Intel, else AVX2/SSE).
sha2 = { version = "0.10", features = ["compress"] }
ureq = { version = "2.10", default-features = false, features = ["json"] }
serde_json = "1"
hex = "0.4"
core_affinity = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
